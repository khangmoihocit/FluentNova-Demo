name: Build and Push Frontend Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for production
        run: |
          cat << EOF > .env
          VITE_API_URL=https://api.fluentnova.site/api/v1
          VITE_PYTHON_API_URL=https://video-api.fluentnova.site
          VITE_PYTHON_API_KEY=${{ secrets.VITE_PYTHON_API_KEY }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VOCABFLOW_EXTENSION_ID=${{ secrets.VITE_VOCABFLOW_EXTENSION_ID }}
          EOF

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: khangmoihocit/vocabflow-frontend:latest